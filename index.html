<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Recruitment charge simulator</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <header class="header">
      <span class="header__name" id="hName"></span>
      <span class="header__spacer"></span>

      <nav class="header__actions" id="headerActions" aria-label="Actions">
        <button class="header__btn" id="periodBtn"></button>
        <button class="header__btn" id="resetBtn"></button>
      </nav>

      <div class="menu" id="pyroMenu">
        <button
          class="header__btn header__btn--menu"
          id="pyroTrigger"
          aria-haspopup="dialog"
          aria-expanded="false"
          aria-controls="pyroPanel"
        >
          <svg
            class="icon"
            viewBox="0 0 32 32"
            aria-hidden="true"
            focusable="false"
          >
            <path d="M10 3h12l8 9-14 17L2 12Zm1.2 2L5.4 11h6.1l2.1-6Zm5.3 0-2.1 6h7.2l-2.1-6Zm5.4 0 2.1 6h6.1l-5.8-6ZM5.9 13l8.4 10.2L11.6 13Zm7.8 0 2.3 8.9 2.3-8.9Zm6.7 0-2.7 10.2L26.1 13Z" />
          </svg>
          <span
            class="header__btn-label header__btn-label--keep mono"
            id="pyroCount"
            >0</span
          >
        </button>
        <div
          class="menu__list menu__panel"
          id="pyroPanel"
          role="dialog"
          aria-labelledby="lblStart"
          hidden
        >
          <label class="lbl" for="pyroStart" id="lblStart"></label>
          <input
            class="numfield"
            type="number"
            id="pyroStart"
            min="0"
            step="1200"
            value="12000"
          />
          <p class="note" id="pyroHint"></p>
        </div>
      </div>

      <div class="menu" id="langMenu">
        <button
          class="header__btn header__btn--menu"
          id="langTrigger"
          aria-haspopup="listbox"
          aria-expanded="false"
          aria-controls="langList"
        >
          <svg
            class="icon"
            viewBox="0 0 32 32"
            aria-hidden="true"
            focusable="false"
          >
            <path
              d="M16 2a14 14 0 1 0 14 14A14 14 0 0 0 16 2Zm11.9 13H23a21.6 21.6 0 0 0-2-8.4A12 12 0 0 1 27.9 15ZM16 28a10.5 10.5 0 0 1-1.5-2.1A19.4 19.4 0 0 1 12.6 17h6.8a19.4 19.4 0 0 1-1.9 8.9A10.5 10.5 0 0 1 16 28Zm-3.4-13a19.4 19.4 0 0 1 1.9-8.9A10.5 10.5 0 0 1 16 4a10.5 10.5 0 0 1 1.5 2.1 19.4 19.4 0 0 1 1.9 8.9ZM11 6.6A21.6 21.6 0 0 0 9 15H4.1A12 12 0 0 1 11 6.6ZM4.1 17H9a21.6 21.6 0 0 0 2 8.4A12 12 0 0 1 4.1 17ZM21 25.4a21.6 21.6 0 0 0 2-8.4h4.9a12 12 0 0 1-6.9 8.4Z"
            />
          </svg>
          <span class="header__btn-label" id="langLabel"></span>
          <svg
            class="icon icon--chevron"
            viewBox="0 0 32 32"
            aria-hidden="true"
            focusable="false"
          >
            <path d="M16 22 6 12l1.4-1.4 8.6 8.6 8.6-8.6L26 12z" />
          </svg>
        </button>
        <ul
          class="menu__list"
          id="langList"
          role="listbox"
          aria-label="Language"
          hidden
        >
          <li class="menu__item" role="option" data-value="ja" lang="ja">
            日本語
          </li>
          <li class="menu__item" role="option" data-value="en" lang="en">
            English
          </li>
        </ul>
      </div>

      <button
        class="header__btn header__btn--icon header__overflow"
        id="overflowBtn"
        aria-haspopup="true"
        aria-expanded="false"
        aria-controls="headerActions"
        aria-label="Menu"
      >
        <svg
          class="icon"
          viewBox="0 0 32 32"
          aria-hidden="true"
          focusable="false"
        >
          <path d="M4 6h24v2H4zm0 9h24v2H4zm0 9h24v2H4z" />
        </svg>
      </button>
    </header>

    <main>
      <div class="section-head">
        <h2 id="h1"></h2>
        <p id="p1"></p>
      </div>
      <div class="grid g2">
        <div class="tile">
          <span class="lbl"
            ><span id="lblN"></span> <span class="tag b" id="tagN"></span
          ></span>
          <div class="meter-row">
            <span class="big" id="cn">0</span
            ><span class="lbl" style="margin: 0 0 6px">/ 200</span>
          </div>
          <div class="track">
            <div class="fill n" id="fn"></div>
            <div class="mark" style="left: 50%"></div>
          </div>
          <div class="scale">
            <span style="left: 50%" id="s100n"></span
            ><span class="r" style="left: 100%" id="s200n"></span>
          </div>
          <p class="note" id="nn"></p>
        </div>
        <div class="tile">
          <span class="lbl"
            ><span id="lblL"></span> <span class="tag m" id="tagL"></span
          ></span>
          <div class="meter-row">
            <span class="big" id="cl">0</span
            ><span class="lbl" style="margin: 0 0 6px">/ 200</span>
          </div>
          <div class="track">
            <div class="fill l" id="fl"></div>
            <div class="mark" style="left: 50%"></div>
          </div>
          <div class="scale">
            <span style="left: 50%" id="s100l"></span
            ><span class="r" style="left: 100%" id="s200l"></span>
          </div>
          <p class="note" id="nl"></p>
        </div>
      </div>

      <div class="section-head">
        <h2 id="h7"></h2>
        <p id="p7"></p>
      </div>
      <div class="grid g2">
        <div class="tile">
          <span class="lbl"
            ><span id="lblBal"></span> <span class="tag b" id="tagCost"></span
          ></span>
          <div class="meter-row">
            <span class="big" id="pyroBal">0</span
            ><span class="lbl" style="margin: 0 0 6px" id="pyroOf"></span>
          </div>
          <div class="track">
            <div class="fill p" id="fp"></div>
          </div>
          <p class="note" id="pyroNote"></p>
        </div>
        <div class="tile">
          <span class="lbl" id="lblSpent"></span>
          <div class="meter-row">
            <span class="big" id="pyroSpent">0</span>
          </div>
          <p class="note" id="pyroPulls"></p>
        </div>
      </div>

      <div class="section-head">
        <h2 id="h2"></h2>
        <p id="p2"></p>
      </div>
      <div class="grid g4" id="banners"></div>

      <div class="section-head">
        <h2 id="h3"></h2>
        <p id="lastLabel"></p>
      </div>
      <div style="padding: 0 16px 16px">
        <div class="slots" id="slots"></div>
      </div>

      <div class="section-head">
        <h2 id="h4"></h2>
        <p id="p4"></p>
      </div>
      <div style="padding: 0 16px 16px">
        <div class="bonus" id="bonus"></div>
      </div>

      <div class="section-head"><h2 id="h5"></h2></div>
      <div class="grid g2">
        <div class="tile">
          <span class="lbl" id="lbl3"></span>
          <div class="slider">
            <div class="row">
              <span class="lim">1</span
              ><input
                type="range"
                id="r3"
                min="1"
                max="10"
                step="0.5"
                value="3"
              /><span class="lim">10</span
              ><output class="val" id="r3v" for="r3">3</output>
            </div>
          </div>
          <span class="lbl" style="margin-top: 20px" id="lblP"></span>
          <div class="slider">
            <div class="row">
              <span class="lim">0.1</span
              ><input
                type="range"
                id="rp"
                min="0.1"
                max="3"
                step="0.1"
                value="0.7"
              /><span class="lim">3</span
              ><output class="val" id="rpv" for="rp">0.7</output>
            </div>
          </div>
        </div>
        <div class="tile">
          <span class="lbl" id="lbl2"></span>
          <div class="slider">
            <div class="row">
              <span class="lim">5</span
              ><input
                type="range"
                id="r2"
                min="5"
                max="30"
                step="0.5"
                value="18.5"
              /><span class="lim">30</span
              ><output class="val" id="r2v" for="r2">18.5</output>
            </div>
          </div>
          <p class="note" id="noteRates"></p>
        </div>
      </div>

      <div class="section-head"><h2 id="h6"></h2></div>
      <div style="padding: 0 16px"><div class="log" id="log"></div></div>
    </main>
  </body>
</html>
